name: Verify game firmware
on:
  pull_request:
    paths: ['firmware/**', 'assets/**', 'data/pokemon_names/**', 'tools/pipeline/**', 'tools/inspector/**', 'tools/release/**', '.github/workflows/firmware-check.yml']
  push:
    branches: [main]
    paths: ['firmware/**', 'assets/**', 'data/pokemon_names/**', 'tools/pipeline/**', 'tools/inspector/**', 'tools/release/**', '.github/workflows/firmware-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install animation test dependency
        run: python3 -m pip install Pillow
      - name: Run production C power and save regression
        run: |
          python3 tools/pipeline/verify_power_audio.py
          python3 tools/pipeline/verify_power_worker.py
          python3 tools/pipeline/verify_display_init.py
          python3 tools/pipeline/verify_display_sleep.py
          python3 tools/pipeline/verify_silent_boot.py
          python3 tools/pipeline/verify_display_settings.py
          python3 tools/pipeline/verify_wifi_time.py
          python3 tools/pipeline/verify_usb_backup.py
          python3 tools/pipeline/verify_usb_import.py
          python3 tools/pipeline/verify_save_import_compatibility.py
          python3 tools/pipeline/verify_save_storage.py
          python3 tools/pipeline/verify_usb_import_device.py
          python3 tools/pipeline/verify_firmware_update.py
          node tools/pipeline/verify_save_import_web.mjs
          python3 tools/pipeline/verify_audio_settings.py
          python3 tools/pipeline/verify_offline_stamina.py
          python3 tools/pipeline/verify_usb_backup_checkpoint.py
          python3 tools/pipeline/verify_achievement_capacity.py
          python3 tools/pipeline/verify_shiny_sources.py
          python3 tools/pipeline/verify_shiny_entry.py
          python3 tools/pipeline/verify_move_names.py
          python3 tools/pipeline/verify_move_settings.py
          python3 tools/pipeline/verify_move_settings_ui.py
          python3 tools/pipeline/verify_move_settings_dungeon.py
          python3 tools/pipeline/verify_box_release.py
          python3 tools/pipeline/verify_box_release_ui.py
          python3 tools/pipeline/verify_dungeon_rewards.py
          python3 tools/pipeline/verify_region_expansion.py
          python3 tools/pipeline/verify_exploration_balance.py
          python3 tools/pipeline/verify_playtime.py
          python3 tools/pipeline/verify_exploration_events.py
          python3 tools/pipeline/verify_care_events_preview.py
          python3 tools/pipeline/verify_region_trails_preview.py
          python3 tools/pipeline/verify_achievements.py
      - name: Build and verify release components
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            cd firmware
            idf.py build
            cd ..
            python tools/pipeline/verify_nvs_restore_roundtrip.py
            python tools/pipeline/verify_dungeon_stack.py
            python tools/pipeline/verify_save_stack.py
            python tools/release/package_firmware.py
            python tools/pipeline/verify_release_partition_protection.py
      - name: Archive firmware and build identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pokewalk-${{ github.sha }}
          path: |
            release/community/PokeWalk-update.zip
            release/community/FoloToy-AI-Passport-full.bin
            release/community/FoloToy-AI-Passport.bin
            release/community/bootloader/bootloader.bin
            release/community/partition_table/partition-table.bin
            release/community/flash_args
            release/community/manifest.json
            firmware/build/project_description.json
          if-no-files-found: error
          retention-days: 14
