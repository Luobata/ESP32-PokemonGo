name: Verify game firmware
on:
  pull_request:
    paths: ['firmware/**', 'assets/**', 'data/pokemon_names/**', 'tools/pipeline/**', 'tools/inspector/**', 'tools/release/**', '.github/workflows/firmware-check.yml']
  push:
    branches: [main]
    paths: ['firmware/**', 'assets/**', 'data/pokemon_names/**', 'tools/pipeline/**', 'tools/inspector/**', 'tools/release/**', '.github/workflows/firmware-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install animation test dependency
        run: python3 -m pip install Pillow
      - name: Run production C power and save regression
        run: |
          failures=()
          run_check() {
            if "$@"; then
              echo "PASS: $*"
            else
              failures+=("$*")
            fi
          }
          run_check python3 tools/pipeline/verify_power_audio.py
          run_check python3 tools/pipeline/verify_power_worker.py
          run_check python3 tools/pipeline/verify_display_init.py
          run_check python3 tools/pipeline/verify_display_sleep.py
          run_check python3 tools/pipeline/verify_silent_boot.py
          run_check python3 tools/pipeline/verify_display_settings.py
          run_check python3 tools/pipeline/verify_wifi_time.py
          run_check python3 tools/pipeline/verify_usb_backup.py
          run_check python3 tools/pipeline/verify_usb_import.py
          run_check python3 tools/pipeline/verify_usb_stream.py
          run_check python3 tools/pipeline/verify_party.py
          run_check python3 tools/pipeline/verify_world_party.py
          run_check python3 tools/pipeline/verify_box_browser.py
          run_check python3 tools/pipeline/verify_save_import_compatibility.py
          run_check python3 tools/pipeline/verify_save_storage.py
          run_check python3 tools/pipeline/verify_usb_import_device.py
          run_check python3 tools/pipeline/verify_firmware_update.py
          run_check node tools/pipeline/verify_save_import_web.mjs
          run_check python3 tools/pipeline/verify_audio_settings.py
          run_check python3 tools/pipeline/verify_offline_stamina.py
          run_check python3 tools/pipeline/verify_usb_backup_checkpoint.py
          run_check python3 tools/pipeline/verify_achievement_capacity.py
          run_check python3 tools/pipeline/verify_shiny_sources.py
          run_check python3 tools/pipeline/verify_shiny_entry.py
          run_check python3 tools/pipeline/verify_move_names.py
          run_check python3 tools/pipeline/verify_move_settings.py
          run_check python3 tools/pipeline/verify_move_settings_ui.py
          run_check python3 tools/pipeline/verify_move_settings_dungeon.py
          run_check python3 tools/pipeline/verify_box_release.py
          run_check python3 tools/pipeline/verify_box_release_ui.py
          run_check python3 tools/pipeline/verify_capture_capacity.py
          run_check python3 tools/pipeline/verify_capture_capacity_ui.py
          run_check python3 tools/pipeline/verify_dungeon_rewards.py
          run_check python3 tools/pipeline/verify_region_expansion.py
          run_check python3 tools/pipeline/verify_exploration_balance.py
          run_check python3 tools/pipeline/verify_playtime.py
          run_check python3 tools/pipeline/verify_exploration_events.py
          run_check python3 tools/pipeline/verify_care_events_preview.py
          run_check python3 tools/pipeline/verify_region_trails_preview.py
          run_check python3 tools/pipeline/verify_achievements.py
          run_check python3 tools/pipeline/verify_transition_bands.py
          run_check python3 tools/pipeline/verify_device_screenshot.py
          run_check python3 tools/pipeline/verify_firmware_preview.py
          run_check python3 tools/pipeline/verify_render_bounds.py
          run_check python3 tools/pipeline/verify_animation_timing.py
          run_check python3 tools/pipeline/verify_scene_pacing.py
          run_check python3 tools/pipeline/verify_battle_timeline.py
          run_check python3 tools/pipeline/verify_battle_motion.py
          run_check python3 tools/pipeline/verify_battle_timeline_ui.py
          run_check python3 tools/pipeline/verify_battle_pace_ui.py
          run_check python3 tools/pipeline/compile_pokemon_slow_timing.py --check
          run_check python3 tools/pipeline/verify_audio_switch.py
          run_check python3 tools/pipeline/verify_music.py
          run_check python3 tools/pipeline/verify_usb_console.py
          run_check python3 tools/pipeline/verify_johto_save.py
          run_check python3 tools/pipeline/verify_johto_routes.py
          run_check python3 tools/pipeline/verify_johto_routes_ui.py
          run_check python3 tools/pipeline/verify_johto_fieldwork.py
          run_check python3 tools/pipeline/verify_johto_fieldwork_ui.py
          run_check python3 tools/pipeline/verify_field_adventure.py
          run_check python3 tools/pipeline/verify_field_adventure_ui.py
          run_check python3 tools/pipeline/compile_field_maps.py --check
          run_check python3 tools/pipeline/verify_field_map_art.py
          run_check python3 tools/pipeline/verify_johto_evolution.py
          run_check python3 tools/pipeline/verify_johto_evolution_ui.py
          run_check python3 tools/pipeline/verify_johto_activity.py
          run_check python3 tools/pipeline/verify_johto_activity_ui.py
          run_check python3 tools/pipeline/verify_johto_story.py
          run_check python3 tools/pipeline/verify_johto_story_ui.py
          run_check python3 tools/pipeline/verify_johto_champion.py
          run_check python3 tools/pipeline/verify_johto_champion_ui.py
          run_check python3 tools/pipeline/verify_johto_champion_balance.py
          run_check python3 tools/pipeline/verify_johto_narrative.py
          run_check python3 tools/pipeline/verify_johto_narrative_ui.py
          if (( ${#failures[@]} )); then
            printf 'FAILED: %s\n' "${failures[@]}"
            exit 1
          fi
      - name: Build and verify release components
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            cd firmware
            idf.py build
            cd ..
            python tools/pipeline/verify_display_ownership.py
            python tools/pipeline/verify_nvs_restore_roundtrip.py
            python tools/pipeline/verify_dungeon_stack.py
            python tools/pipeline/verify_save_stack.py
            python tools/release/package_firmware.py
            python tools/pipeline/verify_release_partition_protection.py
      - name: Archive firmware and build identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pokewalk-${{ github.sha }}
          path: |
            release/community/PokeWalk-update.zip
            release/community/FoloToy-AI-Passport-full.bin
            release/community/FoloToy-AI-Passport.bin
            release/community/bootloader/bootloader.bin
            release/community/partition_table/partition-table.bin
            release/community/flash_args
            release/community/manifest.json
            firmware/build/project_description.json
          if-no-files-found: error
          retention-days: 14
